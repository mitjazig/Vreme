<!DOCTYPE html>
<html lang="sl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070f1a" />
    <meta name="description" content="Zgodovina meritev – IKOPER43 Koper" />
    <title>Zgodovina – Vreme Koper</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="vendor/chart.umd.min.js"></script>
  </head>
  <body class="page-history">
    <div class="bg-gradient" aria-hidden="true"></div>

    <header class="header">
      <div class="header__brand">
        <p class="header__station">IKOPER43 · Statistika</p>
        <h1 class="header__title">Zgodovina</h1>
      </div>
      <div class="header__actions">
        <button type="button" id="btn-reload" class="btn btn--icon" aria-label="Osveži">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-2.64-6.36" />
            <polyline points="21 3 21 9 15 9" />
          </svg>
        </button>
      </div>
    </header>

    <p id="status" class="status" role="status">Nalagam…</p>

    <main class="main main--history">
      <section class="card filters">
        <div class="filters__row">
          <label class="filter-field">
            <span>Leto</span>
            <select id="filter-year"></select>
          </label>
          <label class="filter-field">
            <span>Mesec</span>
            <select id="filter-month"></select>
          </label>
        </div>
        <div class="view-toggle" role="group" aria-label="Način prikaza">
          <button type="button" class="view-toggle__btn view-toggle__btn--active" data-view="daily">Dnevno</button>
          <button type="button" class="view-toggle__btn" data-view="hourly">Urno</button>
        </div>
      </section>

      <section id="period-summary" class="card summary-card" aria-live="polite"></section>

      <div id="charts-daily" class="charts-stack">
        <section class="card chart-card">
          <div class="card__head">
            <span class="card__icon card__icon--warm" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="12" width="4" height="9" rx="1"/><rect x="10" y="7" width="4" height="14" rx="1"/><rect x="17" y="3" width="4" height="18" rx="1"/></svg>
            </span>
            <div>
              <h2 class="card__title">Temperaturni razpon</h2>
              <p class="card__desc">Dnevni minimum in maksimum</p>
            </div>
          </div>
          <div class="chart-wrap">
            <canvas id="chart-temp-range"></canvas>
          </div>
        </section>

        <section class="card chart-card">
          <div class="card__head">
            <span class="card__icon card__icon--warm" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 17 8 11 13 14 21 6"/><line x1="3" y1="21" x2="21" y2="21"/></svg>
            </span>
            <div>
              <h2 class="card__title">Temperatura</h2>
              <p class="card__desc">Povprečje z min in max</p>
            </div>
          </div>
          <div class="chart-wrap">
            <canvas id="chart-temp-avg"></canvas>
          </div>
        </section>

        <section class="card chart-card">
          <div class="card__head">
            <span class="card__icon card__icon--rain" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c0 0-7 8-7 13a7 7 0 0 0 14 0c0-5-7-13-7-13z"/></svg>
            </span>
            <div>
              <h2 class="card__title">Padavine</h2>
              <p class="card__desc">Dnevna količina dežja</p>
            </div>
          </div>
          <div class="chart-wrap chart-wrap--compact">
            <canvas id="chart-precip"></canvas>
          </div>
        </section>
      </div>

      <div id="charts-hourly" class="charts-stack hidden">
        <section class="card chart-card">
          <div class="card__head">
            <span class="card__icon card__icon--warm" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
            </span>
            <div>
              <h2 id="chart-hourly-title" class="card__title">Urne temperature</h2>
              <p class="card__desc">Vsaka ura v mesecu</p>
            </div>
          </div>
          <div class="chart-wrap chart-wrap--tall">
            <canvas id="chart-temp-hourly"></canvas>
          </div>
        </section>
      </div>

      <section class="card table-card">
        <div class="card__head">
          <span class="card__icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </span>
          <div>
            <h2 class="card__title">Dnevni pregled</h2>
            <p class="card__desc">Podrobna tabela</p>
          </div>
        </div>
        <div class="table-scroll">
          <table id="history-table" class="data-table">
            <thead>
              <tr>
                <th>Datum</th>
                <th>Min</th>
                <th>Max</th>
                <th>Povpr.</th>
                <th>Vlaž.</th>
                <th>Dež</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Glavna navigacija">
      <a href="./" class="bottom-nav__link">
        <svg class="bottom-nav__svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M12 3v9m0 0 7.5-4.5M12 12 4.5 7.5M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7" />
        </svg>
        Zdaj
      </a>
      <a href="./forecast.html" class="bottom-nav__link">
        <svg class="bottom-nav__svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M2 12h2M20 12h2M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
          <circle cx="12" cy="12" r="4"/>
        </svg>
        Napoved
      </a>
      <a href="./history.html" class="bottom-nav__link bottom-nav__link--active">
        <svg class="bottom-nav__svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <rect x="3" y="4" width="18" height="18" rx="2" />
          <path d="M16 2v4M8 2v4M3 10h18" />
        </svg>
        Zgodovina
      </a>
    </nav>

    <script type="module" src="js/history.js"></script>
  </body>
</html>

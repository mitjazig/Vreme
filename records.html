<!DOCTYPE html>
<html lang="sl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070f1a" />
    <meta name="description" content="Vremenski rekordi postaje IKOPER43 Koper" />
    <title>Rekordi – Vreme Koper</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="page-records">
    <div class="bg-gradient" aria-hidden="true"></div>

    <header class="header">
      <div class="header__brand">
        <p class="header__station">IKOPER43 · Rekordi</p>
        <h1 class="header__title">Rekordi</h1>
      </div>
      <div class="header__actions">
        <button type="button" id="btn-reload" class="btn btn--icon" aria-label="Osveži">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-2.64-6.36" /><polyline points="21 3 21 9 15 9" />
          </svg>
        </button>
      </div>
    </header>

    <p id="status" class="status" role="status">Nalagam…</p>

    <main class="main main--records">

      <!-- Absolutni rekordi postaje -->
      <section class="card" aria-label="Absolutni rekordi postaje">
        <div class="card__head">
          <span class="card__icon card__icon--warm" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v14"/><path d="M5 9l7 13 7-13"/><circle cx="12" cy="3" r="1"/></svg>
          </span>
          <div>
            <h2 class="card__title">Absolutni rekordi</h2>
            <p class="card__desc" id="records-range">Vse dostopne meritve</p>
          </div>
        </div>
        <div id="all-time-records" class="records-grid">
          <p class="forecast-loading">Nalagam podatke iz vseh let…</p>
        </div>
      </section>

      <!-- Mesečna klimatologija -->
      <section class="card" aria-label="Mesečna klimatologija">
        <div class="card__head">
          <span class="card__icon" style="background:rgba(245,158,11,0.15);color:#f59e0b" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></svg>
          </span>
          <div>
            <h2 class="card__title">Mesečne povprečje</h2>
            <p class="card__desc">Povprečje po mesecih</p>
          </div>
        </div>
        <div id="monthly-climate" class="monthly-climate">
          <p class="forecast-loading">Nalagam…</p>
        </div>
      </section>

      <!-- Temperaturni heatmap -->
      <section class="card heatmap-card" aria-label="Letni temperaturni pregled">
        <div class="card__head">
          <span class="card__icon" style="background:rgba(244,63,94,0.15);color:#f43f5e" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="4" height="4" rx="1"/><rect x="10" y="3" width="4" height="4" rx="1"/><rect x="17" y="3" width="4" height="4" rx="1"/><rect x="3" y="10" width="4" height="4" rx="1"/><rect x="10" y="10" width="4" height="4" rx="1"/><rect x="17" y="10" width="4" height="4" rx="1"/><rect x="3" y="17" width="4" height="4" rx="1"/><rect x="10" y="17" width="4" height="4" rx="1"/><rect x="17" y="17" width="4" height="4" rx="1"/></svg>
          </span>
          <div>
            <h2 class="card__title">Temperaturni pregled leta</h2>
            <p class="card__desc">Dnevna povprečja · vsak kvadrat = 1 dan</p>
          </div>
        </div>
        <div class="heatmap-controls">
          <label class="heatmap-year-label" for="heatmap-year">Leto:</label>
          <select id="heatmap-year" class="filter-select filter-select--sm"></select>
        </div>
        <div id="heatmap-wrap" class="heatmap-wrap">
          <p class="forecast-loading">Nalagam…</p>
        </div>
        <div class="heatmap-legend">
          <span class="heatmap-legend__label">Hladno</span>
          <div class="heatmap-legend__scale"></div>
          <span class="heatmap-legend__label">Vroče</span>
        </div>
      </section>

    </main>

    <nav class="bottom-nav" aria-label="Glavna navigacija">
      <a href="./" class="bottom-nav__link">
        <svg class="bottom-nav__svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M12 3v9m0 0 7.5-4.5M12 12 4.5 7.5M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7" />
        </svg>
        Zdaj
      </a>
      <a href="./forecast.html" class="bottom-nav__link">
        <svg class="bottom-nav__svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M2 12h2M20 12h2M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
          <circle cx="12" cy="12" r="4"/>
        </svg>
        Napoved
      </a>
      <a href="./lokacija.html" class="bottom-nav__link">
        <svg class="bottom-nav__svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M12 2a7 7 0 0 1 7 7c0 5-7 13-7 13S5 14 5 9a7 7 0 0 1 7-7z"/><circle cx="12" cy="9" r="2.5"/>
        </svg>
        Lokacija
      </a>
      <a href="./history.html" class="bottom-nav__link">
        <svg class="bottom-nav__svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <rect x="3" y="4" width="18" height="18" rx="2" />
          <path d="M16 2v4M8 2v4M3 10h18" />
        </svg>
        Zgodovina
      </a>
      <a href="./records.html" class="bottom-nav__link bottom-nav__link--active">
        <svg class="bottom-nav__svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
        </svg>
        Rekordi
      </a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script type="module" src="js/records.js"></script>
  </body>
</html>

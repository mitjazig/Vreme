<!DOCTYPE html>
<html lang="sl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070f1a" />
    <meta name="description" content="Vse vremenske postaje v Sloveniji – ARSO" />
    <title>Postaje SLO – Vreme</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vreme Koper" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="bg-gradient" aria-hidden="true"></div>

    <header class="header">
      <div class="header__brand">
        <p class="header__station">ARSO · Slovenija</p>
        <h1 class="header__title">Postaje</h1>
      </div>
      <div class="header__actions">
        <button type="button" id="btn-reload" class="btn btn--icon" aria-label="Osveži">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/>
          </svg>
        </button>
      </div>
    </header>

    <p id="status" class="status" role="status">Nalagam…</p>

    <main class="main">
      <div class="stations-page-wrap">

        <!-- Sort kontrole -->
        <div class="stations-sort-bar">
          <button class="sort-btn sort-btn--active" data-sort="name">A–Z</button>
          <button class="sort-btn" data-sort="temp-desc">🌡️ Najtopleje</button>
          <button class="sort-btn" data-sort="temp-asc">🥶 Najhladnejše</button>
          <button class="sort-btn" data-sort="wind-desc">💨 Najvetrovnejše</button>
        </div>

        <!-- Seznam postaj -->
        <div id="stations-list" class="stations-page-list">
          <p class="forecast-loading">Nalagam postaje…</p>
        </div>

      </div>
    </main>

    <nav class="bottom-nav" aria-label="Glavna navigacija">
      <a href="./" class="bottom-nav__link">
        <svg class="bottom-nav__svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M12 3v9m0 0 7.5-4.5M12 12 4.5 7.5M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7" />
        </svg>
        Zdaj
      </a>
      <a href="./forecast.html" class="bottom-nav__link">
        <svg class="bottom-nav__svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M12 13v7"/><path d="M8.56 9.56a6 6 0 0 0 0 4.88M15.44 9.56a6 6 0 0 1 0 4.88"/><path d="M5.12 6.12a11 11 0 0 0 0 11.76M18.88 6.12a11 11 0 0 1 0 11.76"/><circle cx="12" cy="13" r="1.5" fill="currentColor" stroke="none"/>
        </svg>
        Postaja
      </a>
      <a href="./lokacija.html" class="bottom-nav__link">
        <svg class="bottom-nav__svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M12 2a7 7 0 0 1 7 7c0 5-7 13-7 13S5 14 5 9a7 7 0 0 1 7-7z"/><circle cx="12" cy="9" r="2.5"/>
        </svg>
        Lokacija
      </a>
      <a href="./postaje.html" class="bottom-nav__link bottom-nav__link--active">
        <svg class="bottom-nav__svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
        Postaje
      </a>
      <a href="./sreca.html" class="bottom-nav__link">
        <svg class="bottom-nav__svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/><path d="M2 12h20"/>
        </svg>
        Kraji
      </a>
    </nav>

    <script type="module" src="js/postaje-page.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="sl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070f1a" />
    <meta name="description" content="Vremenska postaja IKOPER43 – Koper" />
    <title>Vreme Koper – IKOPER43</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="vendor/chart.umd.min.js"></script>
  </head>
  <body>
    <div class="bg-gradient" aria-hidden="true"></div>

    <header class="header">
      <div class="header__brand">
        <p class="header__station">IKOPER43 · Koper</p>
        <h1 class="header__title">Vreme Koper</h1>
      </div>
      <div class="header__actions">
        <button type="button" id="btn-install" class="btn btn--ghost hidden" aria-label="Namesti aplikacijo">
          Namesti
        </button>
        <button type="button" id="btn-refresh" class="btn btn--icon" aria-label="Osveži podatke">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-2.64-6.36" />
            <polyline points="21 3 21 9 15 9" />
          </svg>
        </button>
      </div>
    </header>

    <p id="status" class="status" role="status">Nalagam podatke…</p>

    <main class="main">
      <section class="hero card card--hero" aria-label="Trenutno vreme">
        <div class="hero__glow" aria-hidden="true"></div>
        <div class="hero__icon" id="weather-icon" aria-hidden="true">🌡️</div>
        <div class="hero__temp">
          <span id="temp-main" class="hero__value">—</span>
          <span id="temp-unit" class="hero__unit">°C</span>
        </div>
        <p id="hero-sub" class="hero__sub">—</p>
        <div id="day-range" class="hero__range"></div>
      </section>

      <section class="wind-row">
        <div class="card wind-compass" aria-label="Smer vetra">
          <span class="metric__label">Smer vetra</span>
          <div class="wind-compass__ring">
            <span class="wind-compass__n">S</span>
            <span class="wind-compass__e">V</span>
            <span class="wind-compass__s">J</span>
            <span class="wind-compass__w">Z</span>
            <div id="wind-needle" class="wind-compass__needle"></div>
          </div>
          <p id="wind-dir-label" class="wind-compass__dir">—</p>
        </div>
        <div class="card wind-speed-box">
          <span class="metric__label">Hitrost</span>
          <span id="wind-speed" class="wind-speed-box__value">—</span>
        </div>
      </section>

      <section id="metrics" class="metrics" aria-label="Meritve"></section>

      <section class="card chart-card">
        <div class="card__head">
          <span class="card__icon card__icon--warm" aria-hidden="true">◷</span>
          <div>
            <h2 class="card__title">Zadnjih 24 ur</h2>
            <p class="card__desc">Temperatura in vlažnost</p>
          </div>
        </div>
        <div class="chart-wrap">
          <canvas id="chart-hourly" aria-label="Graf temperature in vlažnosti"></canvas>
        </div>
      </section>

      <section class="card chart-card">
        <div class="card__head">
          <span class="card__icon card__icon--warm" aria-hidden="true">▤</span>
          <div>
            <h2 class="card__title">7 dni</h2>
            <p class="card__desc">Dnevni min / max</p>
          </div>
        </div>
        <div class="chart-wrap chart-wrap--short">
          <canvas id="chart-daily" aria-label="Graf dnevnih min in max temperatur"></canvas>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>Postaja <strong>IKOPER43</strong> · Koper, Slovenija</p>
      <p class="footer__meta">Google Sheets · EasyWeather</p>
    </footer>

    <nav class="bottom-nav" aria-label="Glavna navigacija">
      <a href="./" class="bottom-nav__link bottom-nav__link--active">
        <svg class="bottom-nav__svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M12 3v9m0 0 7.5-4.5M12 12 4.5 7.5M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7" />
        </svg>
        Zdaj
      </a>
      <a href="./history.html" class="bottom-nav__link">
        <svg class="bottom-nav__svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <rect x="3" y="4" width="18" height="18" rx="2" />
          <path d="M16 2v4M8 2v4M3 10h18" />
        </svg>
        Zgodovina
      </a>
    </nav>

    <script type="module" src="js/app.js"></script>
    <noscript>
      <p class="noscript-msg">Za prikaz vremena potrebujete JavaScript.</p>
    </noscript>
  </body>
</html>

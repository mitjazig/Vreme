<!DOCTYPE html>
<html lang="sl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070f1a" />
    <meta name="description" content="Vremenska postaja IKOPER43 – Koper" />
    <title>Vreme Koper – IKOPER43</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vreme Koper" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="vendor/chart.umd.min.js"></script>
  </head>
  <body>
    <div class="bg-gradient" aria-hidden="true"></div>

    <header class="header">
      <div class="header__brand">
        <p class="header__station">IKOPER43 · Koper</p>
        <h1 class="header__title">Vreme Koper</h1>
      </div>
      <div class="header__actions">
        <button type="button" id="btn-install" class="btn btn--ghost hidden" aria-label="Namesti aplikacijo">
          Namesti
        </button>
        <button type="button" id="btn-refresh" class="btn btn--icon" aria-label="Osveži podatke">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-2.64-6.36" />
            <polyline points="21 3 21 9 15 9" />
          </svg>
        </button>
      </div>
    </header>

    <p id="status" class="status" role="status">Nalagam podatke…</p>

    <main class="main">
      <section class="card now-panel" aria-label="Trenutno vreme">
        <div class="now-panel__top">
          <span id="weather-icon" class="now-panel__icon" aria-hidden="true">🌡️</span>
          <div class="now-panel__main">
            <div class="now-panel__temp">
              <span id="temp-main">—</span><span class="now-panel__unit">°C</span>
            </div>
            <p id="hero-sub" class="now-panel__time">—</p>
          </div>
          <div id="day-range" class="now-panel__extremes"></div>
        </div>
        <div class="now-panel__wind">
          <div class="wind-compass wind-compass--sm" aria-label="Smer vetra">
            <div class="wind-compass__ring">
              <div id="wind-needle" class="wind-compass__needle"></div>
            </div>
          </div>
          <div class="now-panel__wind-txt">
            <span id="wind-dir-label" class="now-panel__wind-dir">—</span>
            <span id="wind-speed" class="now-panel__wind-spd">—</span>
          </div>
        </div>
        <div id="metrics" class="now-panel__grid" aria-label="Meritve"></div>
      </section>

      <section class="card chart-card chart-card--hero">
        <div class="card__head">
          <span class="card__icon card__icon--warm" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
          </span>
          <div>
            <h2 class="card__title">Zadnjih 24 ur</h2>
            <p class="card__desc">Temperatura in vlažnost</p>
          </div>
        </div>
        <div class="chart-wrap chart-wrap--hero">
          <canvas id="chart-hourly" aria-label="Graf temperature in vlažnosti"></canvas>
        </div>
      </section>

      <section class="card chart-card">
        <div class="card__head">
          <span class="card__icon card__icon--warm" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="12" width="4" height="9" rx="1"/><rect x="10" y="7" width="4" height="14" rx="1"/><rect x="17" y="3" width="4" height="18" rx="1"/></svg>
          </span>
          <div>
            <h2 class="card__title">7 dni</h2>
            <p class="card__desc">Dnevni min / max</p>
          </div>
        </div>
        <div class="chart-wrap chart-wrap--short">
          <canvas id="chart-daily" aria-label="Graf dnevnih min in max temperatur"></canvas>
        </div>
      </section>

      <section class="card chart-card">
        <div class="card__head">
          <span class="card__icon card__icon--rain" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c0 0-7 8-7 13a7 7 0 0 0 14 0c0-5-7-13-7-13z"/></svg>
          </span>
          <div>
            <h2 class="card__title">Padavine – 24 ur</h2>
            <p class="card__desc">Količina dežja po urah</p>
          </div>
        </div>
        <div class="chart-wrap chart-wrap--short chart-wrap--has-empty">
          <canvas id="chart-precip-24h" aria-label="Graf padavin zadnjih 24 ur"></canvas>
          <p class="chart-empty hidden">Ni padavin v zadnjih 24 urah</p>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>Postaja <strong>IKOPER43</strong> · Koper, Slovenija</p>
      <p class="footer__meta">Google Sheets · EasyWeather</p>
    </footer>

    <nav class="bottom-nav" aria-label="Glavna navigacija">
      <a href="./" class="bottom-nav__link bottom-nav__link--active">
        <svg class="bottom-nav__svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M12 3v9m0 0 7.5-4.5M12 12 4.5 7.5M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7" />
        </svg>
        Zdaj
      </a>
      <a href="./history.html" class="bottom-nav__link">
        <svg class="bottom-nav__svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <rect x="3" y="4" width="18" height="18" rx="2" />
          <path d="M16 2v4M8 2v4M3 10h18" />
        </svg>
        Zgodovina
      </a>
    </nav>

    <script type="module" src="js/app.js"></script>
    <noscript>
      <p class="noscript-msg">Za prikaz vremena potrebujete JavaScript.</p>
    </noscript>
  </body>
</html>
